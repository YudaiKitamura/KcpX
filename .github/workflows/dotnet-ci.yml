name: .NET CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x

      - name: Restoring dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 実機テスト（TestCategory=RealPlc）は KCPX_REAL_PLC 未設定のため Inconclusive になる
      - name: Run Test
        run: dotnet test --configuration Release --no-build --logger trx
        working-directory: TestKcpX
